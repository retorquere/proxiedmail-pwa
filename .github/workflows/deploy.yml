name: Build ProxiedMail Cloudflare Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: 3.47.5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Flutter Web
        run: npm run build

      - name: Verify Flutter artifact
        run: test -f build/web/index.html

      - name: Prepare Flutter Cloudflare artifact
        run: |
          artifact="$RUNNER_TEMP/flutter"
          mkdir -p "$artifact/build"
          cp -R build/web "$artifact/build/web"
          cp worker.ts wrangler.jsonc "$artifact/"
          test -f "$artifact/build/web/index.html"
          test -f "$artifact/worker.ts"
          test -f "$artifact/wrangler.jsonc"

      - name: Publish Flutter Cloudflare artifact branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: flutter
          publish_dir: ${{ runner.temp }}/flutter
          force_orphan: true

  angular:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Build Angular Web
        working-directory: angular
        run: |
          npm ci
          npx ng build --configuration production
          npm run extract-i18n

      - name: Prepare Angular Cloudflare artifact
        run: |
          artifact="$RUNNER_TEMP/angular"
          output=$(find angular/dist/coreui-free-angular-admin-template -maxdepth 2 -name index.html -print -quit | xargs dirname)
          mkdir -p "$artifact/dist"
          cp -R "$output"/. "$artifact/dist/"
          cp angular/worker.ts angular/wrangler.jsonc "$artifact/"
          test -f "$artifact/dist/index.html"
          test -f "$artifact/worker.ts"
          test -f "$artifact/wrangler.jsonc"

      - name: Publish Angular Cloudflare artifact branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: angular
          publish_dir: ${{ runner.temp }}/angular
          force_orphan: true
