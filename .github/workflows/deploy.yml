name: Build ProxiedMail Cloudflare Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: 3.47.5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Flutter Web
        run: npm run build

      - name: Publish Cloudflare artifact branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create cloudflare
          git add -f build/web
          git commit -m "Build Flutter Web artifact" || true
          git push origin HEAD:cloudflare --force
