name: Build ProxiedMail Cloudflare Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: 3.47.5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Flutter Web
        run: npm run build

      - name: Verify Flutter artifact
        run: test -f build/web/index.html

      - name: Prepare Cloudflare artifact
        run: |
          artifact="$RUNNER_TEMP/cloudflare"
          mkdir -p "$artifact/build"
          cp -R build/web "$artifact/build/web"
          cp worker.ts wrangler.jsonc "$artifact/"
          test -f "$artifact/build/web/index.html"
          test -f "$artifact/worker.ts"
          test -f "$artifact/wrangler.jsonc"

      - name: Publish Cloudflare artifact branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: cloudflare
          publish_dir: ${{ runner.temp }}/cloudflare
          force_orphan: true
