<c-container>
  <c-row class="justify-content-center">
    <c-col md="6">
      <c-card class="mx-4 text-center">
        <c-card-body class="p-4">
          <h1>Check your email</h1>
          <p class="text-body-secondary">
            Please click the link sent to <span class="fw-semibold">{{ emailLabel() }}</span>
            to verify your account. Thank you!
          </p>
          <div class="d-grid">
            <a cButton class="w-100" color="primary" routerLink="/authentication/login">Back to login</a>
          </div>
          <p class="text-body-secondary mt-3 mb-0">Didn&rsquo;t receive an email? <button cButton color="link" class="p-0 align-baseline" type="button" (click)="resend()" [disabled]="busy()">{{ busy() ? 'Sending…' : 'Resend' }}</button></p>
          <div *ngIf="message()" class="mt-3 small text-success">{{ message() }}</div>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
</c-container>
