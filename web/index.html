<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Private forwarding addresses for every service.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4169ef">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>ProxiedMail</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --blue: #4169ef; --ink: #202124; --muted: #686b73; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: linear-gradient(145deg, #f7f9ff, #fff 58%); }
    .token-page { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    .token-header { display: flex; align-items: center; gap: 10px; width: min(100% - 40px, 960px); margin: 0 auto; padding: 24px 0; font-size: 20px; font-weight: 700; }
    .token-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--blue); color: #fff; }
    .token-main { display: grid; place-items: center; padding: 32px 20px 80px; }
    .token-panel { width: min(100%, 420px); padding: 30px; border: 1px solid #e2e5ec; border-radius: 8px; background: #fff; box-shadow: 0 18px 55px #23356814; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
    .token-intro { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 650; }
    input { width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid #c9cdd7; border-radius: 6px; font: inherit; }
    input:focus { outline: 3px solid #dce5ff; border-color: var(--blue); }
    button { width: 100%; min-height: 48px; margin-top: 18px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #token-error { min-height: 20px; margin: 14px 0 -4px; color: #b3261e; font-size: 14px; }
    .token-footer { padding: 22px; color: var(--muted); text-align: center; font-size: 13px; }
  </style>
</head>
<body>
  <div class="token-page" id="token-page">
    <header class="token-header"><span class="token-mark">P</span><span>ProxiedMail</span></header>
    <main class="token-main">
      <section class="token-panel" aria-labelledby="token-heading">
        <h1 id="token-heading">Enter your token</h1>
        <p class="token-intro">Use your ProxiedMail bearer token to open the dashboard.</p>
        <form id="token-form">
          <label for="token-password">Token</label>
          <input id="token-password" name="password" type="password" autocomplete="current-password" placeholder="Bearer token" required autofocus>
          <div id="token-error" role="alert" aria-live="polite"></div>
          <button id="token-submit" type="submit">Continue</button>
        </form>
      </section>
    </main>
    <footer class="token-footer">Private forwarding addresses for every service.</footer>
  </div>
  <noscript>You need to enable JavaScript to sign in.</noscript>
  <script>
    const apiToken = localStorage.getItem('flutter.proxiedmail.apiToken');
    if (apiToken) {
      document.getElementById('token-page').remove();
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    } else {
      document.getElementById('token-form').addEventListener('submit', async event => {
        event.preventDefault();
        const input = document.getElementById('token-password');
        const submit = document.getElementById('token-submit');
        const error = document.getElementById('token-error');
        const bearer = input.value.trim().replace(/^Bearer\s+/i, '');
        error.textContent = '';
        submit.disabled = true;
        try {
          const response = await fetch('https://proxiedmail.com/api/v1/api-token', { headers: { Accept: 'application/json', Authorization: `Bearer ${bearer}` } });
          const payload = await response.json().catch(() => null);
          if (!response.ok) throw new Error(payload?.message || payload?.detail || `Request failed (${response.status})`);
          const token = payload?.token || payload?.data?.attributes?.token;
          if (!token) throw new Error('API token response was incomplete.');
          localStorage.setItem('proxiedmail.apiToken', token);
          localStorage.setItem('proxiedmail.bearerToken', bearer);
          localStorage.setItem('flutter.proxiedmail.apiToken', JSON.stringify(token));
          localStorage.setItem('flutter.proxiedmail.bearerToken', JSON.stringify(bearer));
          location.reload();
        } catch (cause) {
          localStorage.removeItem('proxiedmail.apiToken');
          localStorage.removeItem('proxiedmail.bearerToken');
          localStorage.removeItem('flutter.proxiedmail.apiToken');
          localStorage.removeItem('flutter.proxiedmail.bearerToken');
          error.textContent = cause instanceof Error ? cause.message : 'Token verification failed.';
          submit.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
