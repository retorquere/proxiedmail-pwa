name: Build ProxiedMail Cloudflare Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quasar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build Quasar Web
        run: |
          npm ci
          npm run build

      - name: Prepare Quasar Cloudflare artifact
        run: |
          artifact="$RUNNER_TEMP/quasar"
          mkdir -p "$artifact/dist"
          cp -R dist/. "$artifact/dist/"
          cp worker.ts wrangler.jsonc "$artifact/"
          test -f "$artifact/dist/index.html"
          test -f "$artifact/worker.ts"
          test -f "$artifact/wrangler.jsonc"

      - name: Publish Quasar Cloudflare artifact branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: quasar
          publish_dir: ${{ runner.temp }}/quasar
          force_orphan: true
